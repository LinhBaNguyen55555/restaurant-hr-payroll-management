spring.application.name=restaurant-hr-payroll-backend
server.port=8080
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurant_hr_payroll_management}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
app.seed-demo=false
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.mfa-key=${MFA_ENCRYPTION_KEY:}
app.mfa-key-required=true
